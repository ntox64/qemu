# ahcitest slow media: a harddisk-style drive that retries
# internally for ~2 s before completing or giving up.
#   - SLOW1 (sector 6912): recoverable - the read completes after ~2 s
#     with the data intact (the driver must wait it out, not time out);
#   - SLOW2 (sector 6920): unrecoverable-then-recoverable - the first
#     read pays ~2 s of internal retry, then reports UNC; the driver's
#     retry pays another ~2 s and succeeds.
# blkdebug applies the delay BEFORE the error check, so the combined
# latency+error sector fails only after the retry delay, exactly like a
# drive giving up after its error-recovery time.
[latency]
event = "read_aio"
iotype = "read"
sector = "6912"
ns = "2000000000"

[latency]
event = "read_aio"
iotype = "read"
sector = "6920"
ns = "2000000000"

[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "6920"
iotype = "read"
