# vblktest bad-track / device-retry: the FIRST read covering sector
# 1000 fails with EIO once (transient media error); a driver retry of
# the same sector must succeed and return the data intact.
[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "1000"
# iotype restricts the rule to reads: the default mask matches every
# operation type at the given offset, so a write to sector 1000 (the
# harness pre-fills the pattern) would consume the once-error instead.
iotype = "read"
