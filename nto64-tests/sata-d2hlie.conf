# ahcitest D2H false-success: the FIRST read
# covering sector 7696 (0x1e10) fails once with EIO, but the drive's
# D2H completion LIES about it (nto64-d2h-lie-sector=0x1e10 reports a
# clean completion) - the driver must verify the DATA, not trust a
# clean status, then retry and recover.
[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "7696"
iotype = "read"
