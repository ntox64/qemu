# nvmefault cold-data/wear + unplug-hold rules.
# The NVMe namespace drive is raw ON TOP of this blkdebug node, so the
# read_aio/write_aio events land here with byte offsets = LBA * 512.

# Cold data: reads covering LBA 0x8000 pay 25 ms (a significant
# slowdown the guest measures with rdtsc; the data still round-trips).
[latency]
event = "read_aio"
iotype = "read"
sector = "32768"
ns = "25000000"

# Wear: one transient EIO read at LBA 0x4000 (QEMU maps the backend
# error to NVME_UNRECOVERED_READ); the bounded driver retry lands.
[inject-error]
event = "read_aio"
iotype = "read"
sector = "16384"
errno = "5"
once = "on"
immediately = "off"

# Unplug hold: reads at LBA 0xA000 stay in flight for 50 ms, so the
# surprise-unplug trigger always finds 8 outstanding commands.
[latency]
event = "read_aio"
iotype = "read"
sector = "40960"
ns = "50000000"
