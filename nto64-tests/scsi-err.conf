# scsitest sudden SCSI backend errors: one transient error each,
# recovered by a bounded driver retry.  blkdebug errors surface to the
# guest as SCSI CHECK CONDITION with MEDIUM ERROR sense.
[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "1000"
iotype = "read"

[inject-error]
event = "write_aio"
errno = "28"
once = "on"
sector = "3000"
iotype = "write"
