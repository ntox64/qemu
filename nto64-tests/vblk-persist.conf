# vblktest persistent backend error until the condition clears:
#   - while blkdebug is in state 1, every write covering sector 7000
#     fails with EIO (no "once": the error PERSISTS across retries);
#   - a FLUSH (the driver's recovery action) emits flush_to_os, which
#     activates a no-error flush rule (resetting the stale active rule)
#     and moves blkdebug to state 2;
#   - after the flush, the write to sector 7000 must succeed.
# The no-error rule must be checked first, so it comes last in the file
# (process_rule inserts active rules at the list head).
[inject-error]
event = "write_aio"
errno = "5"
sector = "7000"
state = "1"
iotype = "write"

[set-state]
event = "flush_to_os"
state = "1"
new_state = "2"

[inject-error]
event = "flush_to_os"
errno = "0"
iotype = "flush"
