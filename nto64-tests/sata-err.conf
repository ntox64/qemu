# ahcitest sudden backend errors: one transient error each,
# recovered by a bounded driver retry (werror=report/rerror=report on
# the drive, otherwise ENOSPC stops the VM instead of reporting it).
[inject-error]
event = "write_aio"
errno = "5"
once = "on"
sector = "2000"
iotype = "write"

[inject-error]
event = "write_aio"
errno = "28"
once = "on"
sector = "3000"
iotype = "write"

[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "4000"
iotype = "read"
