# ahcitest NCQ bad-track: the FIRST NCQ read
# covering sector 7424 (0x1d00) fails once with EIO; a driver retry
# of the same sector must succeed and return the data intact.
[inject-error]
event = "read_aio"
errno = "5"
once = "on"
sector = "7424"
iotype = "read"
