# usbfault clean bring-up: no error rules.
# The chain is raw -> blkdebug -> file (format on top of blkdebug, so
# the format driver's read_aio/write_aio/flush_to_os events land on the
# blkdebug node).  werror=report/rerror=report on the drive, otherwise
# ENOSPC stops the VM instead of reporting it to the guest.
